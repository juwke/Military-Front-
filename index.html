<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Conquest - Глобальная Стратегия</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col m-0 overflow-hidden select-none">

  <!-- Экран выбора страны -->
  <div id="select-screen" class="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-6">
    <div class="max-w-xl w-full text-center space-y-6">
      <div>
        <h1 class="text-3xl font-extrabold text-amber-500 tracking-wider uppercase mb-2">WORLD CONQUEST</h1>
        <p class="text-sm text-slate-400">Выберите стартовую державу для мирового господства</p>
      </div>
      <div id="country-select-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3 text-left max-h-80 overflow-y-auto p-1">
        <!-- Кнопки стран генерируются из JS -->
      </div>
    </div>
  </div>

  <!-- Шапка состояния игрока -->
  <header class="p-3 bg-slate-900 border-b border-slate-800 flex flex-wrap justify-between items-center gap-3 z-10 shadow-lg">
    <div class="flex items-center gap-3">
      <span id="player-flag" class="text-2xl">🌍</span>
      <div>
        <h1 id="player-name" class="font-bold text-sm text-amber-400">Выберите страну</h1>
        <p id="world-control" class="text-[11px] text-slate-400">Мировой контроль: 0%</p>
      </div>
    </div>

    <div class="flex items-center gap-4 text-xs font-semibold">
      <div class="bg-slate-800 px-3 py-1.5 rounded border border-slate-700">
        💰 Золото: <span id="stat-gold" class="text-amber-400 font-bold">100</span> (+<span id="stat-income">20</span>/ход)
      </div>
      <div class="bg-slate-800 px-3 py-1.5 rounded border border-slate-700">
        ⚔️ Армия: <span id="stat-troops" class="text-red-400 font-bold">50</span>
      </div>
      <div class="bg-slate-800 px-3 py-1.5 rounded border border-slate-700">
        📅 Ход: <span id="stat-turn" class="text-blue-400 font-bold">1</span>
      </div>
    </div>
  </header>

  <!-- Главное игровое поле -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
    
    <!-- Левая панель: Карта/Список государств -->
    <main class="flex-1 p-4 overflow-y-auto bg-slate-950">
      <h2 class="text-xs uppercase font-bold text-slate-400 tracking-wider mb-3">Мировые Державы</h2>
      <div id="countries-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        <!-- Список стран -->
      </div>
    </main>

    <!-- Правая панель: Действия и Лог войны -->
    <aside class="w-full md:w-80 border-t md:border-t-0 md:border-l border-slate-800 p-4 bg-slate-900/80 flex flex-col justify-between">
      
      <!-- Панель приказа -->
      <div class="space-y-4">
        <h2 class="text-xs uppercase font-bold text-slate-400 tracking-wider">Приказы</h2>
        
        <div class="space-y-2">
          <button id="btn-recruit" onclick="recruitTroops()" class="w-full bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 text-xs font-bold py-2.5 px-3 rounded flex justify-between items-center transition">
            <span>⚔️ Нанять дивизию (+10 армия)</span>
            <span class="text-amber-400 font-normal">30 💰</span>
          </button>

          <button id="btn-eco" onclick="upgradeEconomy()" class="w-full bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 text-xs font-bold py-2.5 px-3 rounded flex justify-between items-center transition">
            <span>🏭 Развить экономику (+10 доход)</span>
            <span class="text-amber-400 font-normal">50 💰</span>
          </button>
        </div>

        <hr class="border-slate-800" />

        <!-- Выбранная цель для атаки -->
        <div id="target-card" class="bg-slate-800/50 p-3 rounded border border-slate-700 text-xs space-y-2 hidden">
          <div class="flex justify-between items-center">
            <span class="font-bold text-slate-200">Цель атаки:</span>
            <span id="target-name" class="font-bold text-red-400">-</span>
          </div>
          <div class="text-[11px] text-slate-400 flex justify-between">
            <span>Защита врага:</span>
            <span id="target-troops" class="text-red-400 font-bold">0</span>
          </div>
          <button id="btn-attack" onclick="attackTarget()" class="w-full bg-red-600 hover:bg-red-500 active:scale-95 text-white font-bold py-2 rounded text-xs transition shadow-lg shadow-red-900/30">
            💥 НАПАТЬ!
          </button>
        </div>
      </div>

      <!-- Военный журнал -->
      <div class="mt-4 flex-1 flex flex-col min-h-[140px]">
        <h3 class="text-[11px] uppercase font-bold text-slate-500 mb-1">Военные Хроники</h3>
        <div id="battle-log" class="flex-1 bg-slate-950 border border-slate-800 rounded p-2 text-[11px] text-slate-300 overflow-y-auto space-y-1 font-mono">
          <p class="text-slate-500">// Выберите страну для начала кампании.</p>
        </div>
      </div>

      <!-- Кнопка завершения хода -->
      <button onclick="endTurn()" class="w-full mt-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3 rounded text-xs tracking-wider uppercase transition shadow-lg shadow-amber-500/20 active:scale-95">
        Завершить Ход ➔
      </button>

    </aside>
  </div>

  <script>
    // База данных государств
    const initialCountries = [
      { id: 'USA', name: 'США', flag: '🇺🇸', troops: 80, income: 35, owner: 'AI' },
      { id: 'CHN', name: 'Китай', flag: '🇨🇳', troops: 90, income: 40, owner: 'AI' },
      { id: 'RUS', name: 'Россия', flag: '🇷🇺', troops: 85, income: 30, owner: 'AI' },
      { id: 'DEU', name: 'Германия', flag: '🇩🇪', troops: 50, income: 35, owner: 'AI' },
      { id: 'GBR', name: 'Великобритания', flag: '🇬🇧', troops: 45, income: 30, owner: 'AI' },
      { id: 'FRA', name: 'Франция', flag: '🇫🇷', troops: 45, income: 30, owner: 'AI' },
      { id: 'IND', name: 'Индия', flag: '🇮🇳', troops: 75, income: 25, owner: 'AI' },
      { id: 'BRA', name: 'Бразилия', flag: '🇧🇷', troops: 40, income: 20, owner: 'AI' },
      { id: 'JPN', name: 'Япония', flag: '🇯🇵', troops: 40, income: 35, owner: 'AI' },
      { id: 'EGY', name: 'Египет', flag: '🇪🇬', troops: 35, income: 15, owner: 'AI' },
      { id: 'AUS', name: 'Австралия', flag: '🇦🇺', troops: 30, income: 20, owner: 'AI' },
      { id: 'TUR', name: 'Турция', flag: '🇹🇷', troops: 50, income: 20, owner: 'AI' }
    ];

    let countries = [];
    let playerCountryId = null;
    let gold = 100;
    let turn = 1;
    let selectedTargetId = null;

    // Старт игры и выбор государства
    function initGame() {
      countries = JSON.parse(JSON.stringify(initialCountries));
      const grid = document.getElementById('country-select-grid');
      grid.innerHTML = '';

      countries.forEach(c => {
        const btn = document.createElement('button');
        btn.className = "bg-slate-900 hover:bg-slate-800 border border-slate-700 p-3 rounded flex items-center gap-3 transition text-left";
        btn.innerHTML = `
          <span class="text-2xl">${c.flag}</span>
          <div>
            <div class="font-bold text-xs text-white">${c.name}</div>
            <div class="text-[10px] text-slate-400">Армия: ${c.troops} | Доход: +${c.income}</div>
          </div>
        `;
        btn.onclick = () => selectPlayerCountry(c.id);
        grid.appendChild(btn);
      });
    }

    function selectPlayerCountry(id) {
      playerCountryId = id;
      const player = countries.find(c => c.id === id);
      player.owner = 'PLAYER';

      document.getElementById('select-screen').classList.add('hidden');
      document.getElementById('player-flag').innerText = player.flag;
      document.getElementById('player-name').innerText = player.name;

      logMsg(`ВЫ возглавили государство ${player.name}! Цель: Захватить весь мир.`);
      updateUI();
    }

    function getPlayerStats() {
      const playerLands = countries.filter(c => c.owner === 'PLAYER');
      const totalTroops = playerLands.reduce((sum, c) => sum + c.troops, 0);
      const totalIncome = playerLands.reduce((sum, c) => sum + c.income, 0);
      return { lands: playerLands, totalTroops, totalIncome };
    }

    // Обновление интерфейса
    function updateUI() {
      const stats = getPlayerStats();
      const controlPercent = Math.round((stats.lands.length / countries.length) * 100);

      document.getElementById('stat-gold').innerText = gold;
      document.getElementById('stat-income').innerText = stats.totalIncome;
      document.getElementById('stat-troops').innerText = stats.totalTroops;
      document.getElementById('stat-turn').innerText = turn;
      document.getElementById('world-control').innerText = `Мировой контроль: ${controlPercent}%`;

      // Проверка победы
      if (controlPercent === 100) {
        alert("🎉 ПОБЕДА! Вы завоевали весь мир!");
      }

      // Отрисовка списка стран
      const container = document.getElementById('countries-list');
      container.innerHTML = '';

      countries.forEach(c => {
        const isPlayer = c.owner === 'PLAYER';
        const isSelected = c.id === selectedTargetId;

        const card = document.createElement('div');
        card.className = `p-3 rounded border text-xs relative flex flex-col justify-between gap-2 transition ${
          isPlayer 
            ? 'bg-amber-950/20 border-amber-500/50' 
            : (isSelected ? 'bg-red-950/40 border-red-500' : 'bg-slate-900 border-slate-800 hover:border-slate-700')
        }`;

        card.innerHTML = `
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-2">
              <span class="text-xl">${c.flag}</span>
              <span class="font-bold ${isPlayer ? 'text-amber-400' : 'text-slate-200'}">${c.name}</span>
            </div>
            <span class="text-[10px] px-1.5 py-0.5 rounded font-bold ${isPlayer ? 'bg-amber-500/20 text-amber-300' : 'bg-slate-800 text-slate-400'}">
              ${isPlayer ? 'ВАША' : 'ВРАГ'}
            </span>
          </div>

          <div class="grid grid-cols-2 gap-1 text-[11px] text-slate-400 bg-slate-950/50 p-1.5 rounded">
            <div>⚔️ Армия: <b class="text-white">${c.troops}</b></div>
            <div>💰 Доход: <b class="text-white">+${c.income}</b></div>
          </div>
        `;

        if (!isPlayer) {
          card.style.cursor = 'pointer';
          card.onclick = () => selectTarget(c.id);
        }

        container.appendChild(card);
      });

      // Обновление карточки цели
      if (selectedTargetId) {
        const target = countries.find(c => c.id === selectedTargetId);
        if (target && target.owner !== 'PLAYER') {
          document.getElementById('target-card').classList.remove('hidden');
          document.getElementById('target-name').innerText = target.name;
          document.getElementById('target-troops').innerText = target.troops;
        } else {
          document.getElementById('target-card').classList.add('hidden');
        }
      }
    }

    function selectTarget(id) {
      selectedTargetId = id;
      updateUI();
    }

    // Приказы игрока
    function recruitTroops() {
      if (gold < 30) {
        logMsg("❌ Недостаточно золота для найма дивизии (нужно 30)!");
        return;
      }
      gold -= 30;
      const playerLands = countries.filter(c => c.owner === 'PLAYER');
      const target = playerLands[Math.floor(Math.random() * playerLands.length)];
      target.troops += 10;
      logMsg(`⚔️ Нанято +10 войск в регионе ${target.name}.`);
      updateUI();
    }

    function upgradeEconomy() {
      if (gold < 50) {
        logMsg("❌ Недостаточно золота для развития экономики (нужно 50)!");
        return;
      }
      gold -= 50;
      const playerLands = countries.filter(c => c.owner === 'PLAYER');
      const target = playerLands[Math.floor(Math.random() * playerLands.length)];
      target.income += 10;
      logMsg(`🏭 Экономика ${target.name} увеличена (+10 доход).`);
      updateUI();
    }

    function attackTarget() {
      if (!selectedTargetId) return;
      const target = countries.find(c => c.id === selectedTargetId);
      const stats = getPlayerStats();

      if (stats.totalTroops <= 5) {
        logMsg("❌ Слишком маленькая армия для наступления!");
        return;
      }

      // Механика боя
      const attackPower = Math.floor(stats.totalTroops * (0.6 + Math.random() * 0.5));
      const defensePower = Math.floor(target.troops * (0.7 + Math.random() * 0.5));

      logMsg(`⚔️ Битва за ${target.name}! Атака: ${attackPower} vs Защита: ${defensePower}`);

      if (attackPower > defensePower) {
        // Победа
        target.owner = 'PLAYER';
        target.troops = Math.max(10, Math.floor(attackPower - defensePower));
        logMsg(`🎉 ПОБЕДА! Город ${target.name} захвачен!`);
        selectedTargetId = null;
      } else {
        // Поражение
        const loss = Math.floor(stats.totalTroops * 0.3);
        const playerLands = countries.filter(c => c.owner === 'PLAYER');
        playerLands.forEach(l => l.troops = Math.max(2, Math.floor(l.troops * 0.7)));
        target.troops = Math.max(5, target.troops - Math.floor(attackPower * 0.5));
        logMsg(`💥 Атака отбита! Вы потеряли часть войск.`);
      }

      updateUI();
    }

    // Конец хода
    function endTurn() {
      turn++;
      const stats = getPlayerStats();
      gold += stats.totalIncome;

      // Ход ИИ (Случайные конфликты и рост ИИ)
      const aiCountries = countries.filter(c => c.owner === 'AI');
      aiCountries.forEach(c => {
        c.troops += Math.floor(Math.random() * 5) + 2; // Прирост
      });

      logMsg(`📅 Наступил Ход ${turn}. Получено +${stats.totalIncome} золота.`);
      updateUI();
    }

    function logMsg(msg) {
      const log = document.getElementById('battle-log');
      log.innerHTML += `<div>${msg}</div>`;
      log.scrollTop = log.scrollHeight;
    }

    initGame();
  </script>
</body>
</html>
